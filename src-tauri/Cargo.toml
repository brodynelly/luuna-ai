[package]
name = "luuna-ai"
version = "1.0.2"
description = "LUUNA-AI desktop — Turbo Pascal 7 style native frontend for the Pi coding agent (RPC mode)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
