name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - run: npm ci

      - name: Type-check the Rust backend
        run: npm run check

      - name: Syntax-check the renderer modules
        run: npm run check:js

      - name: Run the Rust unit tests
        run: npm test

      - name: Run the renderer unit tests
        run: npm run test:js

      - name: Build the app
        run: npm run build -- --no-bundle
